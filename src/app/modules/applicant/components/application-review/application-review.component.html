<div class="mb-5">
    <h2 class="text-xl font-bold text-gray-800">Review Your Application</h2>
    <p class="text-sm text-gray-600 mt-1">
        Please check everything below carefully. You can go back to fix anything before submitting; once submitted, this application can no longer be edited.
    </p>
</div>

<!-- Requirements summary -->
<div class="mb-6 bg-white border rounded-lg p-5">
    <div class="flex items-center justify-between mb-3">
        <h3 class="font-semibold text-gray-800">Requirements</h3>
        <button type="button" (click)="editStep.emit('documentsLocation')" class="text-sm text-primary font-medium hover:underline">
            Edit
        </button>
    </div>
    <ul class="grid grid-cols-1 sm:grid-cols-2 gap-2">
        <li *ngFor="let doc of documentSummary" class="flex items-center gap-2 text-sm">
            <i
                [ngClass]="doc.previewUrl ? 'ti ti-circle-check text-green-600' : 'ti ti-exclamation-circle text-red-600'"
                aria-hidden="true"
            ></i>
            <span [ngClass]="doc.previewUrl ? 'text-gray-700' : 'text-red-700'">{{ doc.title }}</span>
        </li>
    </ul>
</div>

<div class="mb-3 flex items-center justify-between">
    <h3 class="font-semibold text-gray-800">Application Form</h3>
    <div class="flex gap-3">
        <button type="button" (click)="editStep.emit('businessInfo')" class="text-sm text-primary font-medium hover:underline">
            Edit Business & Applicant Details
        </button>
        <button type="button" (click)="editStep.emit('businessOperation')" class="text-sm text-primary font-medium hover:underline">
            Edit Business Operation
        </button>
    </div>
</div>

<app-unified-application-form
    [isNew]="is_new"
    [paymentType]="payment_type"

    [businessName]="unifiedData.businessName"
    [franchiseName]="unifiedData.tradeName"
    [dtiNumber]="unifiedData.registrationNumber"
    [registrationDate]="unifiedData.registrationDate"
    [tinNumber]="unifiedData.tin"
    [surname]="unifiedData.surname"
    [givenname]="unifiedData.givenName"
    [middlename]="unifiedData.middleName"
    [suffix]="unifiedData.suffix"
    [email]="unifiedData.email"
    [number]="unifiedData.contactNumber"

    [subdivision]="unifiedData.subdivision"
    [block_no]="unifiedData.blockNumber"
    [lot_no]="unifiedData.lotNumber"
    [name_building]="unifiedData.buildingName"
    [house_no]="unifiedData.houseNumber"
    [street]="unifiedData.streetAddress"
    [barangay]="unifiedData.barangay"
    [city]="unifiedData.city"
    [province]="unifiedData.province"
    [zipCode]="unifiedData.zipCode"

    [operational_subdivision]="unifiedData.operationalSubdivision"
    [operational_block_no]="unifiedData.operationalBlockNumber"
    [operational_lot_no]="unifiedData.operationalLotNumber"
    [operational_name_building]="unifiedData.operationalBuildingName"
    [operational_house_no]="unifiedData.operationalHouseNumber"
    [operationalStreet]="unifiedData.operationalStreet"
    [operationalBarangay]="unifiedData.operationalBarangay"
    [operationalCity]="unifiedData.operationalCity"
    [operationalProvince]="unifiedData.operationalProvince"
    [operationalZipCode]="unifiedData.operationalZipCode"

    [businessArea]="unifiedData.businessArea"
    [businessFloorArea]="unifiedData.totalFloorArea"
    [totalFemale]="unifiedData.totalFemale"
    [totalMale]="unifiedData.totalMale"
    [totalEmployee]="unifiedData.employeesWithinLGU"
    [businessActivity]="unifiedData.businessActivity"

    [businessType]="unifiedData.organizationType"
    [gender]="unifiedData.gender"
    [no_van]="unifiedData.no_van"
    [no_motor]="unifiedData.no_motor"
    [image]="unifiedData.image"
></app-unified-application-form>
