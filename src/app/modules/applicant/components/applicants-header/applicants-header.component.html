<header class="bg-primary md:py-3 py-4 sticky top-0 z-[100]">
    <div class="w-[90%] max-w-[80rem] m-auto flex justify-between items-center">
        <div class="flex items-center gap-5">
            <a routerLink="/applications">
                <img src="../../../assets/images/logo/bislig lgu logo.png" alt="logo" width="70">
            </a>
            <div class="text-white">
                <h1 class="text-xl font-bold">Business Permit and Licensing System</h1>
                <span>Bislig City, Surigao del Sur</span>
            </div>
        </div>

        <div class="flex justify-between items-center gap-2">
            <!-- <app-notification-dropdown></app-notification-dropdown> -->

            <!-- User dropdown -->
            <div class="relative" (click)="openMenu()">
                <button class="flex items-center gap-2 text-white hover:text-gray-200 transition relative">
                    <!-- User Icon or Avatar -->
                    <div class="w-9 h-9 bg-white/20 rounded-full flex justify-center items-center border border-white/30">
                        <svg xmlns="http://www.w3.org/2000/svg" 
                            class="w-5 h-5 text-white" 
                            fill="none" 
                            viewBox="0 0 24 24" 
                            stroke="currentColor" 
                            stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" 
                                d="M5.121 17.804A9.003 9.003 0 0112 15c2.21 0 4.21.805 5.879 2.146M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                    </div>
    
                    <!-- Dropdown arrow -->
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none"
                        viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M19 9l-7 7-7-7" />
                    </svg>
                </button>
    
                <!-- Dropdown menu -->
                <div
                    *ngIf="isMenuOpen"
                >
                    <div
                        class="fixed inset-0 bg-transparent z-[9999]"
                        (click)="closeMenu($event)"
                    ></div>
                    <div class="absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg py-2 z-[9999] animate-fadeIn">
                        <a routerLink="/applications/profile" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">Update Profile</a>
                        <button 
                            (click)="logout($event)"
                            class="w-full text-left px-4 py-2 text-gray-700 hover:bg-gray-100"
                        >
                            Logout
                        </button>
                    </div>
                </div>
            </div>
        </div>

    </div>
</header>
