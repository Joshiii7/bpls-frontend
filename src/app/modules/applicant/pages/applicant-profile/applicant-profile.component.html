<main class="p-7 bg-white rounded-xl border">
    <h2 class="text-2xl font-semibold mb-6 text-gray-800">Profile</h2>

    <section class="grid grid-cols-12 gap-6">

        <!-- Left Column: Signature -->
        <div class="col-span-12 lg:col-span-5 flex flex-col items-center">

            <!-- Signature toggle -->
            <div class="flex gap-2 mb-4 w-full">
                <button type="button" (click)="onSignatureModeChange('upload')"
                        [ngClass]="signatureMode === 'upload' ? 'bg-primary text-white' : 'bg-gray-200 text-gray-700'"
                        class="flex-1 px-4 py-2 rounded-lg focus:outline-none">
                    Upload
                </button>
                <button type="button" (click)="onSignatureModeChange('draw')"
                        [ngClass]="signatureMode === 'draw' ? 'bg-primary text-white' : 'bg-gray-200 text-gray-700'"
                        class="flex-1 px-4 py-2 rounded-lg focus:outline-none">
                    Draw
                </button>
            </div>

            <!-- Upload area -->
            <div *ngIf="signatureMode === 'upload'"
                class="mb-4 w-full bg-white border text-sm rounded-md relative h-40 md:h-60 flex justify-center items-center cursor-pointer"
                (drop)="onDrop($event)"
                (dragover)="onDragOver($event)">
                <input type="file" accept="image/*" (change)="onFileSelect($event)"
                    class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
                <span class="text-gray-400 text-center pointer-events-none">
                    Drag & drop or click to select a signature image
                </span>
            </div>

            <!-- Canvas drawing area -->
            <div *ngIf="signatureMode === 'draw'" class="mb-4 w-full h-40 md:h-60">
                <label for="signature-canvas" class="block font-medium mb-1">Draw Signature</label>
                <canvas #canvas id="signature-canvas"
                        class="w-full h-full bg-white border text-sm rounded-md bg-white"
                        (mousedown)="startDrawing($event)"
                        (mousemove)="draw($event)"
                        (mouseup)="stopDrawing()"
                        (mouseleave)="stopDrawing()"
                        (touchstart)="startDrawing($event)"
                        (touchmove)="draw($event)"
                        (touchend)="stopDrawing()">
                </canvas>
            </div>

            <!-- Buttons: Clear + Save -->
            <div class="flex gap-2 w-full mt-2">
                <button type="button" (click)="clearCanvas()"
                        class="flex-1 bg-red-500 hover:bg-red-600 text-white py-2 rounded-lg font-medium transition">
                    Clear
                </button>
                <button type="button" (click)="onSubmitSignature()"
                        class="flex-1 bg-primary hover:bg-primary-dark text-white py-2 rounded-lg font-medium transition">
                    Save Signature
                </button>
            </div>

        </div>

        <!-- Right Column: Profile Fields -->
        <div class="col-span-12 lg:col-span-7 flex flex-col gap-4">
            <form [formGroup]="profileForm" (ngSubmit)="onSubmitProfile()">

                <!-- Name fields -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label 
                            for="first_name"
                            [ngClass]="{'text-red-500': profileForm.get('first_name')?.invalid && profileForm.get('first_name')?.touched}"
                            class="block font-medium mb-1"
                        >
                            First Name
                        </label>
                        <input id="first_name" formControlName="first_name" placeholder="First Name"
                               class="bg-white border text-sm rounded-md focus:border-blue-500 block w-full p-2.5 text-gray-800 placeholder-gray-400"
                               [ngClass]="{'border-red-500': profileForm.get('first_name')?.invalid && profileForm.get('first_name')?.touched}" />
                        <p *ngIf="profileForm.get('first_name')?.invalid && profileForm.get('first_name')?.touched"
                           class="text-red-500 text-sm mt-1">
                            First name is required and must be letters only.
                        </p>
                    </div>

                    <div>
                        <label for="middle_name" class="block font-medium mb-1">Middle Name</label>
                        <input id="middle_name" formControlName="middle_name" placeholder="Middle Name"
                               class="bg-white border text-sm rounded-md focus:border-blue-500 block w-full p-2.5 text-gray-800 placeholder-gray-400" />
                    </div>

                    <div>
                        <label 
                            for="last_name"
                            [ngClass]="{'text-red-500': profileForm.get('last_name')?.invalid && profileForm.get('last_name')?.touched}"
                            class="block font-medium mb-1"
                        >
                            Last Name
                        </label>
                        <input id="last_name" formControlName="last_name" placeholder="Last Name"
                               class="bg-white border text-sm rounded-md focus:border-blue-500 block w-full p-2.5 text-gray-800 placeholder-gray-400"
                               [ngClass]="{'border-red-500': profileForm.get('last_name')?.invalid && profileForm.get('last_name')?.touched}" />
                    </div>

                    <div>
                        <label for="suffix" class="block font-medium mb-1">Suffix</label>
                        <input id="suffix" formControlName="suffix" placeholder="Suffix"
                               class="bg-white border text-sm rounded-md focus:border-blue-500 block w-full p-2.5 text-gray-800 placeholder-gray-400" />
                    </div>
                </div>

                <!-- Contact fields -->
                <div>
                    <label 
                        for="number"
                        [ngClass]="{'text-red-500': profileForm.get('number')?.invalid && profileForm.get('number')?.touched}"
                        class="block font-medium mb-1"
                    >
                        Phone Number
                    </label>
                    <input 
                        id="number" 
                        formControlName="number" 
                        (blur)="checkUniqueNumber()"
                        (input)="onNumberInput($event)"
                        maxlength="16"
                        placeholder="+63 9## ### ####"
                        class="bg-white border text-sm rounded-md focus:border-blue-500 block w-full p-2.5 text-gray-800 placeholder-gray-400"
                        [ngClass]="{'border-red-500': profileForm.get('number')?.invalid && profileForm.get('number')?.touched}" 
                    />

                    <div 
                        *ngIf="profileForm.get('number')?.errors?.['phoneTaken']"
                        class="text-red-500 text-xs mt-1"
                    >
                        This phone number is already registered.
                    </div>
                </div>

                <div>
                    <label 
                        for="email"
                        [ngClass]="{'text-red-500': profileForm.get('email')?.invalid && profileForm.get('email')?.touched}"
                        class="block font-medium mb-1"
                    >
                        Email
                    </label>
                    <input id="email" formControlName="email" placeholder="Email"
                           class="bg-white border text-sm rounded-md focus:border-blue-500 block w-full p-2.5 text-gray-800 placeholder-gray-400"
                           [ngClass]="{'border-red-500': profileForm.get('email')?.invalid && profileForm.get('email')?.touched}" />
                </div>

                <!-- Profile Submit -->
                <button type="submit"
                        class="mt-4 w-full bg-primary hover:bg-primary-dark text-white py-2 rounded-lg font-medium transition">
                    Save Profile
                </button>

            </form>
        </div>
    </section>
</main>
