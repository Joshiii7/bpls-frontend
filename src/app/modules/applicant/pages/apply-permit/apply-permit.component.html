<main class="grid grid-cols-12 gap-3 relative">
    
    <!-- Payment and Type of Application Section -->
    <section class="col-span-12 lg:col-span-3 bg-white rounded-2xl z-50 border p-6 self-start sticky top-[12.1rem]">
        
        <!-- Type of Application Form -->
        <form [formGroup]="applicationTypeForm" class="mb-6">
            <h2 class="text-lg font-semibold text-gray-700 mb-4">
                Type of Application <span class="text-red-600">*</span>
            </h2>

            <div class="grid grid-cols-12 gap-3">
                <label class="col-span-6 flex items-center gap-2 cursor-pointer">
                    <input
                        type="radio"
                        name="applicationType"
                        formControlName="applicationType"
                        value="new"
                        class="text-primary focus:ring-primary"
                    />
                    <span>New</span>
                </label>

                <label class="col-span-6 flex items-center gap-2 cursor-pointer">
                    <input
                        type="radio"
                        name="applicationType"
                        formControlName="applicationType"
                        value="renew"
                        class="text-primary focus:ring-primary"
                    />
                    <span>Renewal</span>
                </label>
            </div>
        </form>

        <hr class="my-5 border-gray-300" />

        <!-- Payment Option Form -->
        <form [formGroup]="paymentOptionForm">
            <h2 class="text-lg font-semibold text-gray-700 mb-4">
                Payment Option <span class="text-red-600">*</span>
            </h2>

            <div class="grid grid-cols-12 gap-3">
                <label class="col-span-6 flex items-center gap-2 cursor-pointer">
                    <input
                        type="radio"
                        name="paymentOption"
                        formControlName="paymentOption"
                        value="annual"
                        class="text-primary focus:ring-primary"
                    />
                    <span>Annual</span>
                </label>

                <label class="col-span-6 flex items-center gap-2 cursor-pointer">
                    <input
                        type="radio"
                        name="paymentOption"
                        formControlName="paymentOption"
                        value="bi-annual"
                        class="text-primary focus:ring-primary"
                    />
                    <span>Bi-Annual</span>
                </label>

                <label class="col-span-6 flex items-center gap-2 cursor-pointer">
                    <input
                        type="radio"
                        name="paymentOption"
                        formControlName="paymentOption"
                        value="quarterly"
                        class="text-primary focus:ring-primary"
                    />
                    <span>Quarterly</span>
                </label>
            </div>
        </form>
    </section>

    <section class="col-span-12 lg:col-span-9 bg-white">
        
        <!-- Tabs -->
        <div class="flex border-b mb-5">
            <button
                *ngFor="let tab of tabs"
                (click)="switchTab(tab.key)"
                [ngClass]="{
                    'text-primary border-primary': activeTab === tab.key,
                    'text-gray-500 border-transparent': activeTab !== tab.key
                }"
                class="px-4 py-2 border-b-2 font-semibold transition w-full">
                {{ tab.label }}
            </button>
        </div>

        <!-- Business Information -->
        <div *ngIf="activeTab === 'businessInfo'" class="space-y-4">
            <app-business-information-form (formValueChange)="onBusinessInfoFormChange($event)"></app-business-information-form>
        </div>
    </section>
</main>
