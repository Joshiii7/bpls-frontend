<!-- Frosted-glass panel: bg-white/90 is the fallback for browsers without
     backdrop-filter support; when it's supported, the supports-[...] variants
     switch it to a lighter, blurred translucent surface instead. -->
<div class="divide-y divide-white/40 rounded-2xl border border-white/60 shadow-md overflow-hidden max-w-3xl mx-auto bg-white/90 supports-[backdrop-filter]:bg-white/70 supports-[backdrop-filter]:backdrop-blur-md">
    <div *ngFor="let item of items; let i = index">
        <h3 class="m-0">
            <button
                type="button"
                (click)="toggle(i)"
                [attr.aria-expanded]="openIndex === i"
                [attr.aria-controls]="'faq-panel-' + i"
                [id]="'faq-trigger-' + i"
                class="w-full flex items-center justify-between gap-4 text-left px-5 py-4 sm:px-6 sm:py-5 hover:bg-white/40 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-[-2px] focus-visible:outline-primary transition"
            >
                <span class="font-semibold text-gray-800">{{ item.question }}</span>
                <i
                    class="ti ti-chevron-down text-primary flex-shrink-0 transition-transform duration-200"
                    [class.rotate-180]="openIndex === i"
                    aria-hidden="true"
                ></i>
            </button>
        </h3>
        <div
            *ngIf="openIndex === i"
            [id]="'faq-panel-' + i"
            role="region"
            [attr.aria-labelledby]="'faq-trigger-' + i"
            class="px-5 pb-5 sm:px-6 sm:pb-6 text-gray-700 text-sm leading-relaxed"
        >
            {{ item.answer }}
        </div>
    </div>
</div>
