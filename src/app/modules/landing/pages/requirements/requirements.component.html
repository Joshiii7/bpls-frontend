<main id="main" tabindex="-1" class="bg-gray-50">
    <app-page-banner
        title="Requirements &amp; Guidelines"
        description="Getting ready to apply or renew? Here's what to prepare and the steps to follow."
    ></app-page-banner>

    <section class="py-16 md:py-20 lg:py-24">
        <div class="w-[90%] max-w-[80rem] mx-auto">

            <!-- Required Documents -->
            <h2 class="sr-only">Required Documents</h2>
            <div class="grid gap-8 sm:grid-cols-2 lg:grid-cols-3">
                <div *ngFor="let doc of documents" appReveal class="bg-white rounded-2xl border border-gray-100 shadow-sm hover:shadow-lg hover:border-primary/30 hover:-translate-y-1 transition p-8 text-center">
                    <app-icon-badge [icon]="doc.icon" variant="tinted"></app-icon-badge>
                    <h3 class="text-lg font-semibold text-gray-800 mb-2">{{ doc.title }}</h3>
                    <p class="text-gray-600 text-sm">{{ doc.description }}</p>
                </div>
            </div>

            <!-- Guidelines Section -->
            <div class="mt-20">
                <div appReveal>
                    <app-section-heading
                        eyebrow="Step by Step"
                        heading="Application "
                        accent="Guidelines"
                    ></app-section-heading>
                </div>

                <ol class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3 max-w-5xl mx-auto list-none">
                    <li *ngFor="let step of guidelineSteps; let i = index" appReveal class="bg-white rounded-2xl border border-gray-100 shadow-sm hover:border-primary/30 transition p-6 text-left flex gap-4">
                        <div class="flex-shrink-0 flex items-center justify-center bg-primary text-white w-9 h-9 rounded-full font-semibold text-sm">
                            {{ i + 1 }}
                        </div>
                        <div>
                            <i class="{{ step.icon }} text-primary text-lg mb-2" aria-hidden="true"></i>
                            <p class="text-gray-600 text-sm">{{ step.description }}</p>
                        </div>
                    </li>
                </ol>
            </div>
        </div>
    </section>

    <!-- FAQ -->
    <app-faq-section
        eyebrow="Questions"
        heading="Requirements "
        accent="FAQ"
        [items]="faqs"
    ></app-faq-section>

    <section class="bg-gray-50 py-12">
        <div class="w-[90%] max-w-[80rem] mx-auto text-center">
            <a
                routerLink="/auth/register"
                class="inline-flex items-center justify-center min-h-[44px] bg-primary text-white px-8 py-3 rounded-lg shadow hover:bg-green-700 transition font-medium"
            >
                Start Your Application
            </a>
        </div>
    </section>
</main>
