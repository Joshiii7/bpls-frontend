<main id="main" tabindex="-1" class="bg-gray-50">
    <app-page-banner
        title="Our Services"
        description="Whatever you need for your business permit, from applying to renewing, you can probably do it here. Here's what's available."
    ></app-page-banner>

    <section class="py-16 md:py-20 lg:py-24">
        <div class="w-[90%] max-w-[80rem] mx-auto">

            <!-- Service Cards -->
            <h2 class="sr-only">Our Services</h2>
            <div class="grid gap-8 sm:grid-cols-2 lg:grid-cols-3">
                <div *ngFor="let service of services" appReveal class="bg-white rounded-2xl border border-gray-100 shadow-sm hover:shadow-lg hover:border-primary/30 hover:-translate-y-1 transition p-8 text-center">
                    <app-icon-badge [icon]="service.icon" variant="solid"></app-icon-badge>
                    <h3 class="text-xl font-semibold text-gray-800 mb-3">{{ service.title }}</h3>
                    <p class="text-gray-600">{{ service.description }}</p>
                </div>
            </div>
        </div>
    </section>

    <!-- FAQ -->
    <app-faq-section
        eyebrow="Questions"
        heading="Services "
        accent="FAQ"
        [items]="faqs"
    ></app-faq-section>

    <section class="bg-gray-50 py-12">
        <div class="w-[90%] max-w-[80rem] mx-auto text-center">
            <a
                routerLink="/auth/register"
                class="inline-flex items-center justify-center min-h-[44px] bg-primary text-white px-8 py-3 rounded-lg shadow hover:bg-green-700 transition font-medium"
            >
                Apply Now
            </a>
        </div>
    </section>
</main>
