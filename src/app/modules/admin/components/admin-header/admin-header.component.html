<nav class="bg-primary shadow-md">
    <div class="md:py-4 py-2 md:px-8 px-4">
        <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-3">
            
            <!-- Left Section -->
            <div class="flex items-center gap-4">
                <button
                    class="bg-white/90 hover:bg-white p-2 rounded-xl w-[2.8rem] h-[2.8rem] shadow-sm hover:shadow-md transition-all duration-200 flex items-center justify-center"
                    (click)="toggleSidebar()"
                >
                    <i class="fa-solid fa-bars text-lg text-gray-700"></i>
                </button>

                <p-breadcrumb 
                    [model]="items" 
                    [home]="home" 
                    class="text-white/90 font-medium text-sm md:text-base">
                </p-breadcrumb>
            </div>

            <!-- Right Section -->
            <div class="flex flex-col text-white/90 text-xs md:text-sm leading-tight">
                <span class="text-start md:text-end font-medium">Philippine Standard Time</span>
                <span class="text-start md:text-end tracking-wide">{{ currentTime }}</span>
            </div>

        </div>
    </div>
</nav>
