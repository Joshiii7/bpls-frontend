<!-- Mobile backdrop -->
<div
    *ngIf="isMobileOpen"
    class="fixed inset-0 bg-black/50 z-40 md:hidden"
    (click)="closeMobileSidebar()"
></div>

<div
    class="w-64 bg-gray-900 text-white flex flex-col h-screen fixed inset-y-0 left-0 z-50 transition-transform duration-300 md:static md:translate-x-0"
    [ngClass]="isMobileOpen ? 'translate-x-0' : '-translate-x-full'"
>
    <button
        type="button"
        class="md:hidden absolute top-3 right-3 w-8 h-8 rounded bg-white/10 hover:bg-white/20 flex items-center justify-center"
        (click)="closeMobileSidebar()"
        aria-label="Close menu"
    >
        <i class="ti ti-x" aria-hidden="true"></i>
    </button>

    <!-- Branding -->
    <a routerLink="/admin/dashboard" class="flex items-center gap-3 px-5 py-5 border-b border-white/10 hover:bg-white/5 transition">
        <img
            src="assets/images/logo/bislig-lgu-logo.webp"
            alt="Business Permit and Licensing System"
            width="36"
            height="36"
            class="w-9 h-9 rounded-full bg-white p-1 flex-shrink-0"
        >
        <span class="min-w-0">
            <span class="block text-sm font-bold leading-tight truncate">BPLS Admin</span>
            <span class="block text-[11px] text-white/60 leading-tight truncate">Bislig City, Surigao del Sur</span>
        </span>
    </a>

    <!-- Navigation -->
    <nav class="flex-1 px-3 py-4 overflow-y-auto" aria-label="Admin navigation">
        <p class="px-3 text-[11px] font-semibold uppercase tracking-wider text-white/40 mb-1">Overview</p>
        <ul>
            <li>
                <a
                    routerLink="/admin/dashboard"
                    routerLinkActive="bg-primary/15 text-white border-primary"
                    [routerLinkActiveOptions]="{exact: true}"
                    class="flex items-center gap-3 px-3 py-2.5 rounded-md border-l-[3px] border-transparent text-white/70 hover:bg-white/5 hover:text-white transition-colors"
                >
                    <i class="ti ti-dashboard w-5 text-center" aria-hidden="true"></i>
                    <span>Dashboard</span>
                </a>
            </li>
        </ul>

        <p class="px-3 text-[11px] font-semibold uppercase tracking-wider text-white/40 mt-5 mb-1">Applications</p>
        <ul>
            <li>
                <button
                    type="button"
                    (click)="toggleApplicationsDropdown()"
                    [attr.aria-expanded]="isApplicationsOpen"
                    aria-controls="adminApplicationsSubmenu"
                    [ngClass]="isApplicationsOpen ? 'text-white' : 'text-white/70'"
                    class="w-full flex items-center justify-between gap-3 px-3 py-2.5 rounded-md border-l-[3px] border-transparent hover:bg-white/5 hover:text-white transition-colors"
                >
                    <span class="flex items-center gap-3">
                        <i class="ti ti-file-text w-5 text-center" aria-hidden="true"></i>
                        <span>Applications</span>
                    </span>
                    <i class="ti ti-chevron-down text-xs transition-transform" [ngClass]="{'rotate-180': isApplicationsOpen}" aria-hidden="true"></i>
                </button>

                <ul *ngIf="isApplicationsOpen" id="adminApplicationsSubmenu" class="mt-1 space-y-0.5 pl-8 pr-1">
                    <li>
                        <a
                            routerLink="/admin/applications"
                            routerLinkActive="bg-primary/15 text-white border-primary font-medium"
                            [routerLinkActiveOptions]="{exact: true}"
                            class="flex items-center gap-2 px-3 py-2 rounded-md border-l-[3px] border-transparent text-sm text-white/60 hover:bg-white/5 hover:text-white transition-colors"
                        >
                            All Applications
                        </a>
                    </li>
                    <li>
                        <a
                            routerLink="/admin/applications/pending"
                            routerLinkActive="bg-primary/15 text-white border-primary font-medium"
                            class="flex items-center gap-2 px-3 py-2 rounded-md border-l-[3px] border-transparent text-sm text-white/60 hover:bg-white/5 hover:text-white transition-colors"
                        >
                            Pending Review
                        </a>
                    </li>
                    <li>
                        <a
                            routerLink="/admin/applications/approved"
                            routerLinkActive="bg-primary/15 text-white border-primary font-medium"
                            class="flex items-center gap-2 px-3 py-2 rounded-md border-l-[3px] border-transparent text-sm text-white/60 hover:bg-white/5 hover:text-white transition-colors"
                        >
                            Approved
                        </a>
                    </li>
                    <li>
                        <a
                            routerLink="/admin/applications/declined"
                            routerLinkActive="bg-primary/15 text-white border-primary font-medium"
                            class="flex items-center gap-2 px-3 py-2 rounded-md border-l-[3px] border-transparent text-sm text-white/60 hover:bg-white/5 hover:text-white transition-colors"
                        >
                            Declined
                        </a>
                    </li>
                </ul>
            </li>
        </ul>

        <p class="px-3 text-[11px] font-semibold uppercase tracking-wider text-white/40 mt-5 mb-1">Management</p>
        <ul>
            <li>
                <a
                    routerLink="/admin/schedule"
                    routerLinkActive="bg-primary/15 text-white border-primary"
                    class="flex items-center gap-3 px-3 py-2.5 rounded-md border-l-[3px] border-transparent text-white/70 hover:bg-white/5 hover:text-white transition-colors"
                >
                    <i class="ti ti-calendar-event w-5 text-center" aria-hidden="true"></i>
                    <span>Permit Schedule</span>
                </a>
            </li>
        </ul>
    </nav>

    <!-- Account / logout -->
    <div class="border-t border-white/10 px-3 py-3">
        <p *ngIf="fullName" class="px-3 text-xs text-white/50 mb-2 truncate">
            Signed in as <span class="text-white/80 font-medium">{{ fullName }}</span>
        </p>
        <button
            type="button"
            (click)="logout()"
            class="w-full flex items-center gap-3 px-3 py-2.5 rounded-md text-white/70 hover:bg-red-500/10 hover:text-red-300 transition-colors"
        >
            <i class="ti ti-logout w-5 text-center" aria-hidden="true"></i>
            <span>Logout</span>
        </button>
    </div>
</div>
