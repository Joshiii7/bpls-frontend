<div class="flex h-screen">
    
    <!-- Sidebar -->
    <div class="w-64 bg-gray-900 text-white flex flex-col">
        
        <!-- Logo -->
        <div class="flex flex-col gap-4 justify-between items-center">
            <div class="mt-5">
                <img src="../../../assets/images/logo/bislig lgu logo.png" alt="Bislig Logo" width="70">
            </div>
            <div class="w-full ps-5 h-10">
                <h1 class="text-primary text-md font-semibold">Business Permit</h1>
                <p class="text-xs">City of Bislig, Surigao del Sur</p>
            </div>
        </div>
        
        <!-- Menu -->
        <nav class="flex-1 px-4 py-6">
            <ul class="">
                
                <!-- Dashboard -->
                <li class="relative group">
                    <a 
                        [routerLink]="'/admin'" 
                        [ngClass]="{'bg-gray-700 font-bold': currentRoute === '/admin'}"
                        class="flex items-center p-3 rounded relative overflow-hidden transition-colors"
                    >
                        <!-- Hover bar -->
                        <span class="absolute left-0 top-0 h-full w-0 bg-[#008900] transition-all duration-300 ease-out group-hover:w-full"></span>
                        <i class="fas fa-tachometer-alt w-5 z-10"></i>
                        <span class="ml-3 z-10 relative">Dashboard</span>
                    </a>
                </li>

                <!-- Applications Dropdown -->
                <li class="relative group">
                    <button 
                        (click)="toggleApplicationsDropdown()" 
                        class="w-full flex justify-between items-center p-3 rounded relative overflow-hidden transition-colors group"
                    >
                        <span class="absolute left-0 top-0 h-full w-0 bg-[#008900] transition-all duration-300 ease-out group-hover:w-full"></span>
                        <span class="flex items-center z-10 relative">
                            <i class="fas fa-file-alt w-5"></i>
                            <span class="ml-3">Applications</span>
                        </span>
                        <svg class="w-4 h-4 transform z-10 relative" [ngClass]="{'rotate-180': isApplicationsOpen}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                        </svg>
                    </button>

                    <ul *ngIf="isApplicationsOpen" class="mt-2 space-y-1 pl-6">
                        <li class="relative group">
                            <a 
                                [routerLink]="'/admin/review-permit'" 
                                [ngClass]="{'bg-gray-700 font-bold': currentRoute === '/admin/review-permit'}" 
                                class="flex items-center p-3 rounded relative overflow-hidden transition-colors hover:bg-primary"
                            >
                                <span class="ml-2 z-10 relative">Review Application</span>
                            </a>
                        </li>
                        <li class="relative group">
                            <a 
                                [routerLink]="'/admin/approved-applications'" 
                                [ngClass]="{'bg-gray-700 font-bold': currentRoute === '/admin/approved-applications'}" 
                                class="flex items-center p-3 rounded relative overflow-hidden transition-colors hover:bg-primary"
                            >
                                <span class="ml-2 z-10 relative">Approved Applications</span>
                            </a>
                        </li>
                        <li class="relative group">
                            <a 
                                [routerLink]="'/admin/declined-applications'" 
                                [ngClass]="{'bg-gray-700 font-bold': currentRoute === '/admin/declined-applications'}" 
                                class="flex items-center p-3 rounded relative overflow-hidden transition-colors hover:bg-primary"
                            >
                                <span class="ml-2 z-10 relative">Declined Applications</span>
                            </a>
                        </li>
                    </ul>
                </li>

                <!-- Schedules -->
                <li class="relative group">
                    <a 
                        [routerLink]="'/schedules'" 
                        [ngClass]="{'bg-gray-700 font-bold': currentRoute === '/schedules'}" 
                        class="flex items-center p-3 rounded relative overflow-hidden transition-colors"
                    >
                        <span class="absolute left-0 top-0 h-full w-0 bg-[#008900] transition-all duration-300 ease-out group-hover:w-full"></span>
                        <i class="fas fa-calendar-alt w-5 z-10"></i>
                        <span class="ml-3 z-10 relative">Schedules</span>
                    </a>
                </li>

                <!-- Logout -->
                <li class="relative group">
                    <a 
                        (click)="logout()"
                        [ngClass]="{'bg-gray-700 font-bold': currentRoute === '/logout'}" 
                        class="flex items-center p-3 rounded relative overflow-hidden transition-colors cursor-pointer"
                    >
                        <span class="absolute left-0 top-0 h-full w-0 bg-red-700 transition-all duration-300 ease-out group-hover:w-full"></span>
                        <i class="fas fa-sign-out-alt w-5 z-10"></i>
                        <span class="ml-3 z-10 relative">Logout</span>
                    </a>
                </li>

            </ul>
        </nav>

        <!-- Footer -->
        <div class="px-4 py-4 border-t border-gray-800 text-xs text-center">
            <p>&copy; 2024 Joshi Angelo Adlawan</p>
            <p>All Rights Reserved</p>
        </div>
        
    </div>
    
</div>
