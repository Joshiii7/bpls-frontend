<app-applicants-header></app-applicants-header>
<div class="w-[90%] max-w-[80rem] mx-auto">
    <div class="py-6 sticky top-[5.9rem] bg-white z-50">
        <p-breadcrumb [model]="items" [home]="home"></p-breadcrumb>
    </div>
    <router-outlet></router-outlet>

    <button
        type="button"
        class="fixed bottom-20 right-0 p-3 rounded-tl-md rounded-bl-md shadow-lg bg-gray-600 text-white hover:bg-gray-700 transition-all duration-300"
        (click)="scrollToTop()"
        [class.opacity-0]="!showScrollTop"
    >
        <div class="bg-white rounded-full w-7 h-7 flex justify-center items-center">
            <i class="fa-solid fa-arrow-up text-gray-600"></i>
        </div>
    </button>
</div>
<app-footer></app-footer>
