<main class="pb-7">
    <div class="mb-4 p-4 bg-yellow-100 border-l-4 border-yellow-400 text-yellow-800">
        <p>
            Please update your profile first. The information from your profile will be used as the owner’s details when filling out the permit application form.
        </p>
    </div>
    <div class="flex justify-between items-center mb-6">
        <h2 class="font-bold text-xl">Business Permit Applications</h2>
        <button (click)="newApplication()" type="button" class="bg-primary text-white p-2 rounded-md hover:bg-primary/90 transition-all duration-300">+ New Application</button>
    </div>
    <app-application></app-application>
</main>
