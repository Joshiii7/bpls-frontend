<main class="py-6 md:px-8 px-4">
  
    <section class="">

        <section class="flex justify-center items-center lg:w-[59.25rem] md:w-[48.25rem] overflow-scroll">
            <app-form
                [businessName]="businessName"
                [franchiseName]="franchiseName"
                [dtiNumber]="dtiNumber"
                [tinNumber]="tinNumber"
                [surname]="surname"
                [givenname]="givenname"
                [middlename]="middlename"
                [suffix]="suffix"
                [email]="email"
                [number]="number"
    
                [operationalBarangay]="operationalBarangay"
                [operationalCity]="operationalCity"
                [operationalProvince]="operationalProvince"
                [operationalZipCode]="operationalZipCode"
                [operationalStreet]="operationalStreet"
                [operational_house_no]="operational_house_no"
                [operational_name_building]="operational_name_building"
                [operational_lot_no]="operational_lot_no"
                [operational_block_no]="operational_block_no"
                [operational_subdivision]="operational_subdivision"
                
                [barangay]="barangay"
                [city]="city"
                [province]="province"
                [zipCode]="zipCode"
                [street]="street"
                [house_no]="house_no"
                [name_building]="name_building"
                [lot_no]="lot_no"
                [block_no]="block_no"
                [subdivision]="subdivision"
    
                [businessArea]="businessArea"
                [totalFemale]="totalFemale"
                [totalMale]="totalMale"
                [totalEmployee]="totalEmployee"
                [businessActivity]="businessActivity"
                [paymentType]="paymentType"
                [businessType]="businessType"
                [gender]="gender"
                [registrationDate]="dti_registration_date"
                [isNew]="isNew"
                [tracking_number]="tracking_number"
                [business_id_number]="business_id_number"
                [date_of_receipt]="date_of_receipt"
                [image]="signature"
            >
            </app-form>
        </section>
    
		<section class="mt-8">
			<h2 class="text-lg font-semibold text-gray-900 mb-4 border-b border-slate-200 pb-2">
				<i class="fa-solid fa-file"></i>
				Uploaded Documents
			</h2>

			<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5">
				
				<!-- Map -->
				<div *ngIf="lat && lng" class="col-span-1 flex flex-col items-center bg-white border border-slate-200 rounded-xl shadow-sm hover:shadow-md transition-shadow p-3">
					<div class="w-full h-48 rounded-lg overflow-hidden mb-2">
						<app-review-map [lat]="lat" [lng]="lng"></app-review-map>
					</div>
					<p class="text-sm text-slate-600 font-medium mt-1">Business Location</p>
				</div>

				<!-- Document Images -->
				<div 
					*ngFor="let picture of pictures; let i = index" 
					class="col-span-1 flex flex-col items-center bg-white border border-slate-200 rounded-xl shadow-sm hover:shadow-md transition-shadow p-3"
				>
					<a [href]="picture.file_path" target="_blank" class="w-full h-48 rounded-lg overflow-hidden mb-2">
						<img
							[src]="picture.file_path"
							[alt]="picture.type"
							class="h-full w-full object-cover rounded-lg hover:scale-105 transition-transform duration-300"
						/>
					</a>
					<p class="text-sm text-slate-600 font-medium text-center truncate w-full">
						{{ picture.type || 'Document' }}
					</p>
				</div>
			</div>
		</section>

		<!-- Action Section -->
		<section *ngIf="isApplicationsRoute" class="col-span-12 mt-6">

			<h2 class="text-lg font-semibold text-gray-900 mb-4 border-b border-slate-200 pb-2">
				<i class="fa-solid fa-file-signature"></i>
				Application Decision
			</h2>

			<div class="flex justify-center gap-4">
				<!-- Decline Button -->
				<button
					(click)="decline()"
					type="button"
					class="focus:outline-none text-white bg-red-600 hover:bg-red-700 font-medium rounded-lg text-sm px-6 py-2.5 w-full transition duration-200"
				>
					Decline
				</button>

				<!-- For Revision Button -->
				<!-- (click)="forRevision()" -->
				<!-- <button
					type="button"
					class="focus:outline-none text-white bg-yellow-500 hover:bg-yellow-600 font-medium rounded-lg text-sm px-6 py-2.5 w-full transition duration-200"
				>
					For Revision
				</button> -->

				<!-- Approve Button -->
				<button
					(click)="approve()"
					type="button"
					class="focus:outline-none text-white bg-primary hover:bg-primary/90 font-medium rounded-lg text-sm px-6 py-2.5 w-full transition duration-200"
				>
					Approve
				</button>
			</div>
		</section>
    </section>
</main>

<div 
	(click)="visible = false"
	*ngIf="visible" 
	class="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-50">

	<div
		(click)="$event.stopPropagation()"
		class="bg-white rounded-lg shadow-lg w-[90%] sm:w-[28rem] p-5"
	>
		<h2 class="text-lg font-semibold text-slate-800 mb-4">Decline Application</h2>

		<label for="declineReason" class="block mb-2 text-sm text-slate-600">Reason for Declining</label>
		<textarea
			id="declineReason"
			rows="4"
			[(ngModel)]="declineReason"
			placeholder="Enter your reason here..."
			class="w-full border border-slate-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-primary/50 mb-4">
		</textarea>

		<div class="flex justify-end gap-3">
			<button 
				type="button" 
				class="px-4 py-2 rounded-md text-slate-700 hover:bg-slate-100 font-medium"
				(click)="visible = false">
				Cancel
			</button>
			
			<button 
				type="button" 
				class="px-4 py-2 rounded-md text-white font-medium bg-primary hover:bg-primary/90" 
				(click)="confirmDecline()">
				Submit
			</button>
		</div>
	</div>
</div>

<!-- Loading -->
<div *ngIf="isLoading" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-60 z-50">
<div class="text-center">
    <i class="fa-solid fa-spinner fa-spin text-4xl text-white"></i>
    <p class="mt-4 text-white text-lg">Loading, please wait...</p>
</div>
</div>
