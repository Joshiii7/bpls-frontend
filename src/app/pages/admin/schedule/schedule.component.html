<div class="py-7 w-[90%] max-w-[80rem] mx-auto">
    <h2 class="text-2xl font-bold mb-4">Business Permit Scheduler</h2>

    <!-- Form -->
    <div class="bg-white p-6 rounded shadow-md mb-6">
        <h3 class="font-semibold mb-4">Add New Schedule</h3>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <input type="date" [(ngModel)]="newSchedule.start_date" class="border p-2 rounded" placeholder="Start Date" />
            <input type="date" [(ngModel)]="newSchedule.end_date" class="border p-2 rounded" placeholder="End Date" />
            <input type="text" [(ngModel)]="newSchedule.schedule_type" class="border p-2 rounded" placeholder="Schedule Type" />
        </div>
        <button 
            (click)="addSchedule()"
            class="mt-4 bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 transition"
        >
            Add Schedule
        </button>
    </div>

    <!-- Schedule List -->
    <div class="bg-white p-6 rounded shadow-md">
        <h3 class="font-semibold mb-4">Scheduled Applications</h3>
        <div *ngIf="schedules.length === 0" class="text-gray-500">No schedules added yet.</div>
        <ul *ngIf="schedules.length > 0" class="space-y-2">
            <li *ngFor="let schedule of schedules; let i = index"
                class="flex justify-between items-center border p-3 rounded">
                <div>
                    <span class="font-semibold">{{ schedule.start_date }}</span> - 
                    <span class="font-semibold">{{ schedule.end_date }}</span> | 
                    {{ schedule.schedule_type }}
                </div>
                <button 
                    (click)="removeSchedule(i)"
                    class="text-red-500 hover:text-red-700 font-bold"
                >
                    Delete
                </button>
            </li>
        </ul>
    </div>
</div>
