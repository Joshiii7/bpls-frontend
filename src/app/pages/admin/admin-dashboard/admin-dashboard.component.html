<main class="py-6 md:px-8 px-2">
    <!-- Information Cards -->
    <section>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 md:gap-4 gap-0">
            <!-- Pending Permits -->
            <div class="relative flex flex-col min-w-0 mb-6 break-words bg-white shadow-md rounded-lg bg-clip-border">
                <div class="flex-auto p-4">
                    <div class="flex flex-wrap -mx-3">
                        <div class="flex-none w-2/3 max-w-full px-3">
                            <div>
                                <p class="mb-0 font-sans font-semibold leading-normal text-sm">Pending Permits</p>
                                <h5 class="mb-0 font-bold">
                                    <span>{{ displayPending }} </span>
                                    <span class="leading-normal text-sm font-weight-bolder text-lime-500">+55%</span>
                                </h5>
                            </div>
                        </div>
                        <div class="w-4/12 max-w-full px-3 ml-auto text-right flex-0">
                            <div class="inline-block w-12 h-12 text-center rounded-lg bg-gradient-to-tl from-purple-700 to-pink-500 shadow-soft-2xl">
                                <i class="fa-regular fa-clock text-white text-xl relative top-2.5"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Approved Permits -->
            <div class="relative flex flex-col min-w-0 mb-6 break-words bg-white shadow-md rounded-lg bg-clip-border">
                <div class="flex-auto p-4">
                    <div class="flex flex-wrap -mx-3">
                        <div class="flex-none w-2/3 max-w-full px-3">
                            <div>
                                <p class="mb-0 font-sans font-semibold leading-normal text-sm">Approved Permits</p>
                                <h5 class="mb-0 font-bold">
                                    <span>{{ displayApproved }} </span>
                                    <span class="leading-normal text-sm font-weight-bolder text-lime-500">+55%</span>
                                </h5>
                            </div>
                        </div>
                        <div class="w-4/12 max-w-full px-3 ml-auto text-right flex-0">
                            <div class="inline-block w-12 h-12 text-center rounded-lg bg-gradient-to-tl from-purple-700 to-pink-500 shadow-soft-2xl">
                                <!-- <i class="fa-regular fa-circle-check text-white text-xl relative top-2.5"></i> -->
                                <span class="text-white text-xl relative top-2.5">✔</span>
                                <!-- <i class="fas fa-check-circle text-white text-lg relative top-2.5"></i> -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Declined Permits -->
            <div class="relative flex flex-col min-w-0 mb-6 break-words bg-white shadow-md rounded-lg bg-clip-border">
                <div class="flex-auto p-4">
                    <div class="flex flex-wrap -mx-3">
                        <div class="flex-none w-2/3 max-w-full px-3">
                            <div>
                                <p class="mb-0 font-sans font-semibold leading-normal text-sm">Declined Permits</p>
                                <h5 class="mb-0 font-bold">
                                    <span>{{ displayDeclined }} </span>
                                    <span class="leading-normal text-sm font-weight-bolder text-lime-500">+55%</span>
                                </h5>
                            </div>
                        </div>
                        <div class="w-4/12 max-w-full px-3 ml-auto text-right flex-0">
                            <div class="inline-block w-12 h-12 text-center rounded-lg bg-gradient-to-tl from-purple-700 to-pink-500 shadow-soft-2xl">
                                <i class="fa-solid fa-xmark text-white text-xl relative top-2.5"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Total Users -->
            <div class="relative flex flex-col min-w-0 mb-6 break-words bg-white shadow-md rounded-lg bg-clip-border">
                <div class="flex-auto p-4">
                    <div class="flex flex-wrap -mx-3">
                        <div class="flex-none w-2/3 max-w-full px-3">
                            <div>
                                <p class="mb-0 font-sans font-semibold leading-normal text-sm">Total Users</p>
                                <h5 class="mb-0 font-bold">
                                    <!-- <span id="user-count">{{ totalUser }}</span> -->
                                    <span>{{ displayValue }} </span> <!-- Display the counting number -->
                                    <!-- <span class="leading-normal text-sm font-weight-bolder text-lime-500">+55%</span> -->
                                </h5>
                            </div>
                        </div>
                        <div class="w-4/12 max-w-full px-3 ml-auto text-right flex-0">
                            <div class="inline-block w-12 h-12 text-center rounded-lg bg-gradient-to-tl from-purple-700 to-pink-500 shadow-soft-2xl">
                                <i class="fas fa-users text-white text-xl relative top-2.5"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    
    <!-- Charts -->
    <section class="grid grid-cols-1 md:grid-cols-10 gap-5">
        <!-- Pending Chart -->
        <div class="w-full max-w-full lg:flex-none col-span-10 md:col-span-4">
            <div class="relative z-20 flex flex-col min-w-0 break-words bg-white border-0 border-solid border-black-125 shadow-md rounded-lg bg-clip-border">
              <div class="p-6 pb-0 mb-0 border-b-0 border-solid border-black-125 rounded-t-2xl">
                <h6 class="text-dark">Pending Permits Aging</h6>
              </div>
              <div class="flex-auto p-4">
                <div>
                  <canvas id="pendingPermitsChart" height="150"></canvas>
                </div>
              </div>
            </div>
        </div>

        <!-- Monthly Chart -->
        <div class="w-full max-w-full lg:flex-none col-span-10 md:col-span-6">
            <div class="relative z-20 flex flex-col min-w-0 break-words bg-white border-0 border-solid border-black-125 shadow-md rounded-lg bg-clip-border">
              <div class="p-6 pb-0 mb-0 border-b-0 border-solid border-black-125 rounded-t-2xl">
                <h6 class="text-dark">Monthly Overview of Business Permits for the Last 12 Months</h6>
              </div>
              <div class="flex-auto p-4">
                <div>
                  <canvas id="businessPermitChart" height="150"></canvas>
                </div>
              </div>
            </div>
        </div>
    </section>

    <section>
    </section>
</main>
<p-toast></p-toast>

<div *ngIf="isLoading" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-60 z-50">
    <div class="text-center">
        <i class="fa-solid fa-spinner fa-spin text-4xl text-white"></i>
        <p class="mt-4 text-white text-lg">Loading, please wait...</p>
    </div>
</div>
