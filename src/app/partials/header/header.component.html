<nav class="bg-primary">
  <div class="md:py-3 py-2 md:px-8 px-4">
    <div class="flex flex-col md:flex-row py-3 md:px-0 px-3 md:items-center items-start justify-between">
      <div class="flex items-center justify-between gap-3 mb-2 md:mb-0">
        <button
            class="bg-white p-2 rounded-full w-[2.7rem] h-[2.7rem] shadow-md hover:bg-gray-200 transition z-10"
            (click)="toggleSidebar()"
        >
          <i class="fa-solid fa-bars text-xl"></i>
        </button>
        <p-breadcrumb [model]="items" [home]="home"></p-breadcrumb>
      </div>

      <div class="flex flex-col text-white">
        <span class="text-start md:text-end text-xs md:text-sm">Philippine Standard Time:</span>
        <span class="text-start md:text-end text-xs md:text-sm">{{ currentTime }}</span>
      </div>
    </div>
  </div>
</nav>
