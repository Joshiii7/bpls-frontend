<div
    (mouseenter)="onHover(true)"
    (mouseleave)="onHover(false)"
    [ngClass]="{'w-72': isSidebarOpen, 'w-24': !isSidebarOpen}"
    class="relative flex h-full transition-all duration-300 ease-in-out bg-gray-800 hover:w-72 group"
>
    <div class="h-full lg:w-72 md:w-32 w-full bg-gray-800 p-5 md:p-2 text-white flex md:justify-start justify-between items-center md:flex-col flex-row">
        <div class="mt-3">
            <img class="w-12" src="../../../assets/images/logo/bislig lgu logo.png" alt="bislig logo">
        </div>
        <div class="w-full ps-5 mt-12">
            <div
                [ngClass]="{
                'hidden opacity-0 max-h-0 max-w-0 overflow-hidden duration-0': !isHovered && !isSidebarOpen,
                'opacity-100 max-h-24 duration-1000': isHovered || isSidebarOpen
                }"
            >
                <h1 class="text-white text-sm font-semibold">Business Permit</h1>
                <p class="text-xs">Municipality of Bislig, Surigao del Sur</p>
            </div>
        </div>
        
        <!-- Side Bar for user -->
        <div *ngIf="roleID == 2" class="w-full md:py-5 p-2 flex md:flex-col flex-row">
            <button (click)="sidebarMenu(1)" [ngClass]="{'bg-green-800 lg:rounded-md rounded font-bold' : sideMenu === 1}" class="flex gap-3 w-full ps-5 pe-3 lg:py-3 py-2 md:border-b text-sm text-white drops">
                <i class="fa-solid fa-house text-sm transition-all duration-300 ease-in-out"></i>
                <!-- <div [ngClass]="{'hidden' : !isSidebarOpen}" class="transition-all duration-1000 ease-in-out">Dashboard</div> -->
                <div class="transition-all ease-in-out" [ngClass]="{'opacity-0 max-h-0 max-w-0 overflow-hidden duration-0': !isHovered && !isSidebarOpen, 'opacity-100 max-h-24 duration-500': isHovered || isSidebarOpen}">Dashboard</div>
            </button>
            <button (click)="sidebarMenu(2)" [ngClass]="{'bg-green-800 lg:rounded-md rounded font-bold' : sideMenu === 2}" class="flex gap-3 w-full ps-5 pe-3 lg:py-3 py-2 md:border-b text-sm text-white drops">
                <i class="fa-regular fa-file text-md transition-all duration-300 ease-in-out"></i>
                <!-- <div [ngClass]="{'hidden' : !isSidebarOpen}" class="transition-all duration-1000 ease-in-out">Dashboard</div> -->
                <div class="transition-all ease-in-out" [ngClass]="{'opacity-0 max-h-0 max-w-0 overflow-hidden duration-0': !isHovered && !isSidebarOpen, 'opacity-100 max-h-24 duration-500': isHovered || isSidebarOpen}">My Applications</div>
            </button>
            <button (click)="sidebarMenu(3)" [ngClass]="{'bg-green-800 lg:rounded-md rounded font-bold' : sideMenu === 3}" class="flex gap-3 w-full ps-5 pe-3 lg:py-3 py-2 md:border-b text-sm text-white drops">
                <i class="fa-solid fa-gear text-md transition-all duration-300 ease-in-out"></i>
                <!-- <div [ngClass]="{'hidden' : !isSidebarOpen}" class="transition-all duration-1000 ease-in-out">Dashboard</div> -->
                <div class="transition-all ease-in-out" [ngClass]="{'opacity-0 max-h-0 max-w-0 overflow-hidden duration-0': !isHovered && !isSidebarOpen, 'opacity-100 max-h-24 duration-500': isHovered || isSidebarOpen}">Settings</div>
            </button>
            <button (click)="sidebarMenu(4)" [ngClass]="{'bg-green-800 lg:rounded-md rounded font-bold' : sideMenu === 4}" class="flex gap-3 w-full ps-5 pe-3 lg:py-3 py-2 md:border-b text-sm text-white drops">
                <i class="fas fa-sign-out-alt text-md transition-all duration-300 ease-in-out"></i>
                <!-- <div [ngClass]="{'hidden' : !isSidebarOpen}" class="transition-all duration-1000 ease-in-out">Dashboard</div> -->
                <div class="transition-all ease-in-out" [ngClass]="{'opacity-0 max-h-0 max-w-0 overflow-hidden duration-0': !isHovered && !isSidebarOpen, 'opacity-100 max-h-24 duration-500': isHovered || isSidebarOpen}">Logout</div>
            </button>
        </div>
    
        <!-- Side Bar for admin -->
        <div *ngIf="roleID == 1" class="w-full md:py-5 p-2 flex md:flex-col flex-row">
            <button (click)="sidebarMenu(5)" [ngClass]="{'bg-green-800 lg:rounded-md rounded font-bold' : sideMenu === 5}" class="flex gap-3 w-full ps-5 pe-3 lg:py-3 py-2 md:border-b text-sm text-white drops">
                <i class="fa-solid fa-house text-sm transition-all duration-300 ease-in-out"></i>
                <!-- <div [ngClass]="{'hidden' : !isSidebarOpen}" class="transition-all duration-1000 ease-in-out">Dashboard</div> -->
                <div class="transition-all ease-in-out" [ngClass]="{'opacity-0 max-h-0 max-w-0 overflow-hidden duration-0': !isHovered && !isSidebarOpen, 'opacity-100 max-h-24 duration-500': isHovered || isSidebarOpen}">Dashboard</div>
            </button>
            <button (click)="sidebarMenu(6)" [ngClass]="{'bg-green-800 lg:rounded-md rounded font-bold' : sideMenu === 6}" class="flex gap-3 w-full ps-5 pe-3 lg:py-3 py-2 md:border-b text-sm text-white drops">
                <i class="fas fa-folder-open text-sm transition-all duration-300 ease-in-out"></i>
                <div class="transition-all ease-in-out" [ngClass]="{'opacity-0 max-h-0 max-w-0 overflow-hidden duration-0': !isHovered && !isSidebarOpen, 'opacity-100 max-h-24 duration-500': isHovered || isSidebarOpen}">New Application</div>
            </button>
            <button (click)="sidebarMenu(7)" [ngClass]="{'bg-green-800 lg:rounded-md rounded font-bold' : sideMenu === 7}" class="flex gap-3 w-full ps-5 pe-3 lg:py-3 py-2 md:border-b text-sm text-white drops">
                <i class="fa-solid fa-check text-sm transition-all duration-300 ease-in-out"></i>
                <div class="transition-all ease-in-out" [ngClass]="{'opacity-0 max-h-0 max-w-0 overflow-hidden duration-0': !isHovered && !isSidebarOpen, 'opacity-100 max-h-24 duration-500': isHovered || isSidebarOpen}">Approved Application</div>
            </button>
            <button (click)="sidebarMenu(8)" [ngClass]="{'bg-green-800 lg:rounded-md rounded font-bold' : sideMenu === 8}" class="flex gap-3 w-full ps-5 pe-3 lg:py-3 py-2 md:border-b text-sm text-white drops">
                <i class="fa-solid fa-xmark text-sm transition-all duration-300 ease-in-out"></i>
                <div class="transition-all ease-in-out" [ngClass]="{'opacity-0 max-h-0 max-w-0 overflow-hidden duration-0': !isHovered && !isSidebarOpen, 'opacity-100 max-h-24 duration-500': isHovered || isSidebarOpen}">Declined Application</div>
            </button>
            <button (click)="sidebarMenu(9)" [ngClass]="{'bg-green-900 lg:rounded-md rounded font-bold' : sideMenu === 9}" class="flex gap-3 w-full ps-5 pe-3 lg:py-3 py-2 md:border-b text-sm text-white drops">
                <i class="fas fa-sign-out-alt text-sm transition-all duration-300 ease-in-out"></i>
                <div class="transition-all ease-in-out" [ngClass]="{'opacity-0 max-h-0 max-w-0 overflow-hidden duration-0': !isHovered && !isSidebarOpen, 'opacity-100 max-h-24 duration-500': isHovered || isSidebarOpen}">Logout</div>
            </button>
        </div>

        <div
            [ngClass]="{
                'hidden opacity-0 max-h-0 max-w-0 overflow-hidden duration-0': !isHovered && !isSidebarOpen,
                'opacity-100 max-h-24 duration-1000': isHovered || isSidebarOpen
            }"
            class="w-full mt-auto p-3 flex flex-col items-center text-xs text-gray-400"
        >
            <p>&copy; 2024 Joshi Angelo Adlawan</p>
            <p>All Rights Reserved</p>
        </div>
    </div>
</div>
