<header class="bg-primary md:py-3 py-4 sticky top-0 z-[9999]">
    <div class="w-[90%] max-w-[80rem] m-auto flex justify-between items-center">
        <div class="flex items-center gap-5">
            <a href="">
                <img src="../../../assets/images/logo/bislig lgu logo.png" alt="logo" width="70">
            </a>
            <div class="text-white">
                <h1 class="text-xl font-bold">Business Permit and Licensing System</h1>
                <span>Bislig City, Surigao del Sur</span>
            </div>
        </div>

        <!-- User dropdown -->
        <div class="relative" (click)="openMenu()">
            <button class="flex items-center gap-2 text-white hover:text-gray-200 transition">
                <span>Welcome, {{ username || 'User' }}</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none"
                    viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M19 9l-7 7-7-7" />
                </svg>
            </button>

            <!-- Dropdown menu -->
            <div
                *ngIf="isMenuOpen"
            >
                <div
                    class="fixed inset-0 bg-transparent z-[9998]"
                    (click)="closeMenu($event)"
                ></div>
                <div class="absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg py-2 z-[9999] animate-fadeIn">
                    <a class="block px-4 py-2 text-gray-700 hover:bg-gray-100">Update Profile</a>
                    <button 
                        (click)="logout($event)"
                        class="w-full text-left px-4 py-2 text-gray-700 hover:bg-gray-100"
                    >
                        Logout
                    </button>
                </div>
            </div>
        </div>
    </div>
</header>
