<div *ngIf="visible" class="fixed inset-0 z-[9999] bg-black/60 flex items-center justify-center p-2 sm:p-4" (click)="close()">
  <div
    class="bg-white rounded-lg shadow-xl w-full max-w-4xl h-[92vh] flex flex-col overflow-hidden"
    (click)="$event.stopPropagation()"
  >

    <!-- Toolbar -->
    <div class="flex items-center justify-between gap-2 px-3 sm:px-4 py-3 border-b bg-gray-50">
      <div class="flex items-center gap-2 min-w-0">
        <i class="ti ti-file-type-pdf text-red-600 text-lg flex-shrink-0"></i>
        <span class="font-semibold text-gray-800 truncate text-sm sm:text-base">{{ fileName }}</span>
      </div>
      <div class="flex items-center gap-1.5 sm:gap-2 flex-shrink-0">
        <button
          type="button"
          (click)="download()"
          [disabled]="isGenerating || !!errorMessage"
          class="text-xs sm:text-sm px-2.5 sm:px-3 py-1.5 rounded-md bg-primary text-white hover:bg-primary/90 disabled:opacity-40 disabled:cursor-not-allowed flex items-center gap-1.5"
          aria-label="Download PDF"
          title="Download PDF"
        >
          <i class="ti ti-download" aria-hidden="true"></i> <span class="hidden sm:inline">Download</span>
        </button>
        <button
          type="button"
          (click)="print()"
          [disabled]="isGenerating || !!errorMessage"
          class="text-xs sm:text-sm px-2.5 sm:px-3 py-1.5 rounded-md border border-gray-300 hover:bg-gray-100 disabled:opacity-40 disabled:cursor-not-allowed flex items-center gap-1.5"
          aria-label="Print PDF"
          title="Print PDF"
        >
          <i class="ti ti-printer" aria-hidden="true"></i> <span class="hidden sm:inline">Print</span>
        </button>
        <button
          type="button"
          (click)="close()"
          class="w-8 h-8 flex items-center justify-center rounded hover:bg-gray-200 text-gray-500"
          aria-label="Close preview"
          title="Close preview"
        >
          <i class="ti ti-x" aria-hidden="true"></i>
        </button>
      </div>
    </div>

    <!-- Body -->
    <div class="flex-1 bg-gray-200 relative">
      <div *ngIf="isGenerating" class="absolute inset-0 flex flex-col items-center justify-center gap-3 text-gray-600">
        <i class="ti ti-loader ti-spin text-3xl text-primary"></i>
        <p class="text-sm">Generating PDF...</p>
      </div>

      <div *ngIf="!isGenerating && errorMessage" class="absolute inset-0 flex flex-col items-center justify-center gap-3 text-center px-8">
        <i class="ti ti-alert-triangle text-3xl text-red-500"></i>
        <p class="text-sm text-gray-700 font-medium">Couldn't generate the PDF.</p>
        <p class="text-xs text-gray-500 max-w-sm">{{ errorMessage }}</p>
      </div>

      <iframe
        *ngIf="!isGenerating && !errorMessage && safeUrl"
        #pdfFrame
        [src]="safeUrl"
        class="w-full h-full border-0"
        title="PDF preview"
      ></iframe>
    </div>
  </div>
</div>
