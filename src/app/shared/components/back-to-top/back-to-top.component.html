<button
    type="button"
    class="fixed bottom-6 right-4 sm:right-6 z-40 w-11 h-11 sm:w-12 sm:h-12 flex items-center justify-center rounded-full shadow-lg bg-primary text-white hover:bg-primary-dark focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary transition-all duration-300"
    (click)="scrollToTop()"
    [class.opacity-0]="!showScrollTop"
    [class.pointer-events-none]="!showScrollTop"
    [attr.aria-hidden]="!showScrollTop"
    [attr.tabindex]="showScrollTop ? 0 : -1"
    aria-label="Back to top"
    title="Back to top"
>
    <i class="ti ti-arrow-up" aria-hidden="true"></i>
</button>
