<section class="relative overflow-hidden text-center py-16 md:py-20">
    <!-- Background image -->
    <img
        src="assets/images/banner/cedo-background-1500.webp"
        srcset="assets/images/banner/mobile/cedo-background-500.webp 500w, assets/images/banner/cedo-background-1500.webp 1500w"
        sizes="100vw"
        width="1500"
        height="942"
        alt=""
        aria-hidden="true"
        fetchpriority="high"
        class="absolute inset-0 w-full h-full object-cover"
    >

    <!-- Dark overlay so the heading text stays readable over any photo -->
    <div class="absolute inset-0 bg-black/70" aria-hidden="true"></div>

    <div class="relative z-10 w-[90%] max-w-[80rem] mx-auto">
        <h1 class="text-4xl md:text-5xl font-bold text-white leading-tight">{{ title }}</h1>
        <div class="h-1 w-14 rounded-full bg-primary mx-auto mt-4" aria-hidden="true"></div>
        <p *ngIf="description" class="mt-4 text-gray-200 text-lg max-w-2xl mx-auto">
            {{ description }}
        </p>
    </div>
</section>
