<div class="flex flex-col items-center mt-5">
    <h2 class="text-lg font-bold mb-3">Draw Your Signature</h2>

    <canvas
        #canvas
        width="700"
        height="250"
        class="border-2 border-dashed border-gray-400 rounded-lg bg-white"
        (mousedown)="onMouseDown($event)"
        (mousemove)="onMouseMove($event)"
        (mouseup)="onMouseUp()"
        (mouseleave)="onMouseUp()"
        (touchstart)="onTouchStart($event)"
        (touchmove)="onTouchMove($event)"
        (touchend)="onTouchEnd()"
    ></canvas>

    <div class="flex justify-between items-center w-full gap-3 mt-4">
        <button
            class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded-md w-full"
            (click)="clearCanvas()"
        >
            Clear
        </button>

        <button
            class="bg-primary hover:bg-primary/80 text-white px-4 py-2 rounded-md w-full"
            (click)="saveImage()"
        >
            Save
        </button>
    </div>
</div>
