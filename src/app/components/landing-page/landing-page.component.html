<div *ngIf="isLoggedIn">
    <app-header></app-header>
</div>
<div class="flex flex-col lg:flex-row items-center lg:justify-around justify-center px-8 py-8 mx-auto h-screen lg:py-0">
    <a href="#" class="flex items-center justify-between mb-6 text-2xl font-semibold">
        <!-- <img class="w-8 h-8 mr-2" src="https://flowbite.s3.amazonaws.com/blocks/marketing-ui/logo.svg" alt="logo"> -->
        <p class="text-gray-800">Business Permit and Licensing System</p>
        <!-- Flowbite -->
    </a>
    <div class="w-full rounded-lg shadow md:mt-0 sm:max-w-md xl:p-0 dark:bg-gray-200">
        <div class="p-6 space-y-4 md:space-y-6 sm:p-8">
            <h1 class="text-xl font-bold leading-tight tracking-tight text-center text-gray-900 md:text-2xl">
                Sign in to your account
            </h1>
            <form [formGroup]="loginForm" (ngSubmit)="loginSubmit()" class="space-y-4 md:space-y-6">
                <div>
                    <input type="text" name="username" id="username" formControlName="username" class="bg-gray-50 border border-gray-900 text-gray-900 rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-white dark:border-gray-600 dark:placeholder-gray-400 dark:text-gray-900 dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="Lylexavierr" required="">
                </div>
                <div>
                    <input type="password" name="password" id="password" formControlName="password" placeholder="••••••••" class="bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-white dark:border-gray-600 dark:placeholder-gray-400 dark:text-gray-900 dark:focus:ring-blue-500 dark:focus:border-blue-500" required="">
                </div>
                <div class="flex items-center justify-between">
                    <div class="flex items-start">
                        <div class="flex items-center h-5">
                            <input id="remember" aria-describedby="remember" type="checkbox" class="w-4 h-4 border border-gray-300 rounded bg-gray-50 focus:ring-3 focus:ring-primary-300 dark:bg-gray-700 dark:border-gray-600 dark:focus:ring-primary-600 dark:ring-offset-gray-800" required="">
                        </div>
                        <div class="ml-3 text-sm">
                            <label for="remember" class="dark:text-dark">Remember me</label>
                        </div>
                    </div>
                    <a href="#" class="text-sm font-medium text-dark hover:underline dark:text-primary-500">Forgot password?</a>
                </div>
                <button type="submit" class="w-full bg-red-700 text-white p-2 rounded-lg">Sign in</button>
                <p class="text-sm font-light text-dark text-center">
                    Don’t have an account yet? <a href="#" class="font-medium text-primary-600 hover:underline dark:text-primary-500">Sign up</a>
                </p>
            </form>
        </div>
    </div>
</div>
